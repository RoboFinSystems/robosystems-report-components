version: 2

updates:
  # npm — package.json and package-lock.json dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    # Routine minor/patch churn arrives as two PRs instead of a dozen.
    # Majors are deliberately left ungrouped: they need individual triage,
    # and grouping them would force an all-or-nothing call on unrelated bumps.
    # That matters more here than in an app — the `dependencies` block
    # (jsonld, marked, n3) is this package's public surface, and roboledger-app
    # and roboinvestor-app both install it.
    # vite-toolchain is the exception and is listed first (a dependency joins
    # the first group it matches): those packages are peer-locked to each
    # other, so they are already one decision.
    groups:
      # Only vitest matches today, but vite and @vitest/* are peer-locked to
      # it (vitest peers vite; @vitest/coverage-v8 peers vitest at an exact
      # version), so the group is here before it is needed rather than after
      # a split major deadlocks two PRs against each other.
      vite-toolchain:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - '@vitest/*'
      # @eslint/js peers eslint at the *same* major (10.x peers ^10.0.0), so
      # the two can only ever move together. Dependabot proposed them as two
      # separate PRs on 2026-09-01 (#44 eslint, #45 @eslint/js) and #45 went
      # red immediately — @eslint/js 10 against eslint 9 cannot resolve. No
      # update-types filter, so majors travel together. typescript-eslint and
      # the prettier bridge peer eslint across a range and ride along safely.
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'typescript-eslint'
          - 'eslint-config-prettier'
          - 'eslint-plugin-prettier'
      npm-production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      npm-development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Blocked upstream: typescript-eslint v8 peers typescript
      # ">=4.8.4 <6.1.0". TypeScript 7 is also the native Go port, so it is a
      # migration to schedule rather than a bump to take. Drop this entry once
      # typescript-eslint v9 supports the 7.x line.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # @types/node tracks the runtime floor, not npm's cadence. This package
      # declares engines >=22.0.0 — matching robosystems-core and
      # robosystems-typescript-client, the other two published libraries — and
      # as a library it has to keep compiling for the oldest Node it claims to
      # support. Newer types would let code referencing Node 24+ APIs typecheck
      # clean here and still break a consumer on Node 22. Drop this entry when
      # engines moves off >=22.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      #
      # Deliberately absent, in case someone copies this file from a sibling:
      # no `eslint` major ignore. The frontend apps and robosystems-core block
      # ESLint 10 because eslint-plugin-jsx-a11y and eslint-plugin-react cap at
      # ^9; this package depends on neither, so ESLint 10 may install cleanly
      # here and is worth attempting rather than pre-emptively blocking.

  # GitHub Actions — pinned action versions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
